[package]
name = "phoenix"
version = "0.0.1"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = { version = "30.0.2", default-features = false, features = ["webgpu", "wgsl"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Performance"] }
bytemuck = { version = "1", features = ["derive"] }
console_error_panic_hook = "0.1"
glam = "0.30"
