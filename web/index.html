<!doctype html>
<meta charset="utf-8">
<title>Phoenix · demo avanzada</title>
<style>
html,body{margin:0;background:#000;overflow:hidden}
canvas{width:100vw;height:100vh;display:block}
#hud{position:fixed;left:10px;top:10px;color:#f1e7b8;font:12px/1.5 monospace;white-space:pre;text-shadow:0 0 3px #000,0 0 3px #000;display:none}
#help{position:fixed;left:10px;bottom:10px;color:#f1e7b8;font:12px monospace;text-shadow:0 0 3px #000,0 0 3px #000;opacity:.7}
#cap{position:fixed;right:6vw;bottom:14vh;font:600 clamp(18px,2.6vw,38px)/1.2 "IBM Plex Sans",system-ui,sans-serif;color:#e9e27a;
  background:rgba(20,20,12,.55);padding:.25em .6em;opacity:0;transition:opacity .8s;text-shadow:0 1px 2px #000;pointer-events:none}
#cap small{display:block;font-weight:400;font-size:.5em;color:#f3efc9;margin-top:.2em}
#ui{position:fixed;right:10px;top:10px;width:250px;color:#f1e7b8;font:11px/1.4 monospace;background:rgba(14,13,9,.78);padding:8px 10px;border:1px solid #4a4528;max-height:calc(100vh - 20px);overflow:auto}
#ui h4{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#e9e27a;cursor:pointer}
#ui label{display:grid;grid-template-columns:96px 1fr 38px;gap:6px;align-items:center;margin:3px 0}
#ui label.chk{grid-template-columns:auto 1fr}
#ui output{text-align:right;color:#bfb57a}
#ui input[type=range]{width:100%;accent-color:#e9e27a}
#ui .row{display:flex;gap:4px;margin:6px 0}
#ui button{flex:1;background:#26230f;color:#f1e7b8;border:1px solid #4a4528;font:11px monospace;padding:3px 2px;cursor:pointer}
#ui button:hover{background:#3a3516}
#ui.min>*:not(h4){display:none}
#load{position:fixed;inset:0;display:grid;place-items:center;color:#f1e7b8;font:14px monospace;background:#000}
</style>
<canvas id="c"></canvas><div id="hud"></div><div id="ui"></div><div id="cap"></div><div id="load">cargando…</div>
<div id="help">F: vuelo libre (clic = capturar raton, WASD, Espacio/Ctrl, Mayus rapido) · H: estadisticas · R: reiniciar secuencia · L: panel de luz</div>
<script type="module">
import { supported, loadPackage, createEngine, light, watch } from "./phoenix.js";
const hud = document.getElementById("hud"), cap = document.getElementById("cap"), load = document.getElementById("load");
window.onunhandledrejection = (e) => { load.style.display = "grid"; load.textContent = "ERROR " + (e.reason && e.reason.message || e.reason); };
const q = new URLSearchParams(location.search);
const cine = true;
const dir = q.get("assets") || "assets-ms";
const N = +(q.get("n") || (cine ? 2000000 : 160000));
const EXTRA = cine ? 60000 : 0; // rocas de la escena cinematografica
if (!(await supported())) { load.textContent = "Este navegador no tiene WebGPU con indirect-first-instance (usa Chrome/Edge recientes)."; throw new Error("sin WebGPU"); }
load.textContent = "descargando modelos…";
const pkg = await loadPackage(dir);
const meta = pkg.meta;
const c = document.getElementById("c"), dpr = Math.min(devicePixelRatio, 2);
const fit = () => { c.width = innerWidth * dpr; c.height = innerHeight * dpr; };
fit();
load.textContent = "creando escena…";
// Escena: el anfitrion (esta pagina) genera las instancias [x, y, z, escala, modelo, yaw, hash, 0];
// Phoenix solo las recibe (`create` y `set_instances`). Estatua heroe, ejercito, rocas y escombros.
const info = new Float32Array(meta.info);
const buildScene = (count) => {
  const hs = (i, k) => {
    let h = Math.imul(i, 0x9E3779B1) ^ Math.imul(k, 0x85EBCA6B);
    h ^= h >>> 16; h = Math.imul(h, 0x7FEB352D); h ^= h >>> 15; h = Math.imul(h, 0x846CA68B); h ^= h >>> 16;
    return (h & 0xffffff) / 16777215;
  };
  const off = (m) => info[m * 16 + 13], hgt = (m) => info[m * 16 + 14];
  const out = new Float32Array(count * 8);
  const rocks = Math.min(60000, count >> 2), ns = count - rocks, sStatue = 4.6 / hgt(0), cols = 480, nb = 60;
  for (let i = 0; i < count; i++) {
    let x, y, z, sc, m = 0, yaw, hash;
    if (i === 0) { x = 0; y = sStatue * off(0); z = 0; sc = sStatue; yaw = 0; hash = 0.5; }
    else if (i >= ns) {
      const r = i - ns;
      if (r < 40) { x = (hs(i, 1) - 0.5) * 70; z = 12 + hs(i, 2) * 38; sc = 2.5 + hs(i, 3) * 3.5; }
      else if (r < 3000) { const an = hs(i, 1) * 6.2832, rad = 4 + hs(i, 2) * 55, q = hs(i, 3); x = Math.cos(an) * rad; z = Math.sin(an) * rad; sc = 0.12 + q * q * q * 2.6; }
      else if (r < 32000) { x = (hs(i, 1) - 0.5) * 6.5; z = -70 - hs(i, 2) * 900; sc = 0.07 + hs(i, 3) * hs(i, 3) * 0.3; }
      else { x = (hs(i, 1) - 0.5) * 1500; z = -80 - hs(i, 2) * 4000; sc = 0.3 + hs(i, 3) * hs(i, 3) * 3; }
      m = 1 + (i % (meta.models - 1)); y = sc * (off(m) - 0.22); yaw = hs(i, 4) * 6.2832; hash = hs(i, 5);
    } else {
      const k = i - 1, c0 = k % cols, r = Math.floor(k / cols), bl = Math.floor(c0 / 8), kk = c0 % 8;
      x = (bl - nb / 2 + 0.5) * 23.6 + (kk - 3.5) * 2.2; sc = sStatue * (0.98 + hs(i, 3) * 0.04);
      y = sc * off(0); z = -80 - r * 3.6; yaw = (hs(i, 4) - 0.5) * 0.15; hash = hs(i, 5);
    }
    out.set([x, y, z, sc, m, yaw, hash, 0], i * 8);
  }
  return out;
};
const p = await createEngine(c, pkg, { capacity: N + EXTRA, instances: buildScene(N + EXTRA), environment: cine });
const guard = watch(p, (m, lost) => { load.style.display = "grid"; load.textContent = (lost ? "" : "Error de GPU: ") + m; });
window.__p = p;
// Luces puntuales (culling por clusters en GPU): brasas junto a la estatua heroe y farolillos por el pasillo.
const baseLights = [];
{
  // Formato lux: 16 floats por luz (puntual, foco o tubo).
  const PL = light.point, SP = light.spot, TB = light.tube;
  const L = [];
  for (const [x, y, z] of [[-3.5, 1.2, -3.5], [3.8, 1.0, -2.5], [0, 1.0, 4]]) L.push(...PL(x, y, z, 9, 1.0, 0.55, 0.25, 18));
  for (let z = -120; z > -900; z -= 45) L.push(...PL(0, 1.5, z, 14, 1.0, 0.6, 0.3, 14));
  // Dos focos frios sobre la estatua heroe y un tubo fluorescente vertical.
  L.push(...SP(5, 9, 7, 30, 0.85, 0.92, 1.0, 260, -5, -6.5, -7, 20));
  L.push(...SP(-6, 8, -6, 30, 1.0, 0.9, 0.75, 260, 6, -5.5, 6, 20));
  L.push(...TB(-7, 2.5, -2, 12, 0.7, 0.85, 1.0, 30, 0, 1, 0, 4));
  baseLights.push(...L);
}
addEventListener("resize", () => { fit(); p.resize(c.width, c.height); });
load.style.display = "none";

// ---- Panel de iluminacion ----
const S = { el: 37.7, az: 289.7, sun: 1, amb: 1, exp: 1, pl: 1, moon: 1, bloom: 0.05, ao: 0.6, aor: 0.6, minpx: 1, far: 0.6, tau: +(q.get("tau") || 1), shadows: q.get("shadows") !== "0", occ: q.get("occ") !== "0", lights: true, pause: false };
let tSeq = 0;
const sm = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a) / (b - a))); return k * k * (3 - 2 * k); };
const mixc = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
const applyLight = () => {
  const el = S.el * Math.PI / 180, se = Math.sin(el);
  p.set_sun_dir(S.az * Math.PI / 180, el);
  // Color y radiancia del sol: se enrojece y se atenua cerca del horizonte (extincion atmosferica).
  const c = mixc([1, 0.45, 0.2], [1, 0.93, 0.82], Math.min(1, Math.max(0, se * 3)));
  const k = 2.4 * S.sun * sm(-0.05, 0.12, se) * (0.4 + 0.6 * Math.min(1, Math.max(0, se * 2)));
  p.set_sun(c[0] * k, c[1] * k, c[2] * k, 0.9 * S.amb);
  p.set_exposure(S.exp);
  p.set_post(S.bloom, S.ao, S.aor);
  p.set_min_pixels(S.minpx);
  p.set_far_tolerance(S.far);
  const mk = 0.6 * S.moon * (1 - sm(-0.14, 0.1, se));
  p.set_moon((S.az + 180) * Math.PI / 180, 0.6, 0.35 * mk, 0.5 * mk, 0.9 * mk);
  p.set_shadows(S.shadows);
  p.set_occlusion(S.occ);
  p.set_tolerance(S.tau);
  const L = S.lights ? baseLights.map((v, i) => (i % 16 === 7 ? v * S.pl : v)) : [];
  p.set_lights(new Float32Array(L));
};
const ui = document.getElementById("ui");
ui.innerHTML = '<h4>Iluminación · L</h4>';
const sliders = [
  ["el", "Elevación sol", -15, 88, 0.5, "°"], ["az", "Azimut sol", 0, 360, 1, "°"], ["sun", "Intensidad sol", 0, 4, 0.05, ""],
  ["amb", "Ambiente", 0, 3, 0.05, ""], ["exp", "Exposición", 0.2, 4, 0.05, ""], ["pl", "Luces", 0, 6, 0.1, ""], ["moon", "Luna", 0, 3, 0.1, ""], ["bloom", "Bloom", 0, 0.5, 0.01, ""], ["ao", "AO", 0, 1, 0.05, ""], ["aor", "Radio AO", 0.1, 2, 0.05, "m"],
  ["tau", "Tolerancia LOD", 0.4, 3, 0.1, "px"], ["minpx", "Descarte", 0.5, 6, 0.5, "px"], ["far", "LOD lejano", 0, 1.5, 0.1, ""],
];
const outs = {}, ins = {};
const fmtv = (v, st, u) => (+v).toFixed(st < 0.1 ? 2 : st < 1 ? 1 : 0) + u;
const showVals = () => { for (const [key, , , , st, u] of sliders) { ins[key].value = S[key]; outs[key].textContent = fmtv(S[key], st, u); } };
for (const [key, name, mn, mx, st, u] of sliders) {
  const l = document.createElement("label");
  l.innerHTML = `${name}<input type="range" min="${mn}" max="${mx}" step="${st}"><output></output>`;
  const r = l.querySelector("input"), o = l.querySelector("output");
  outs[key] = o; ins[key] = r;
  r.oninput = () => { S[key] = +r.value; o.textContent = fmtv(r.value, st, u); applyLight(); };
  ui.appendChild(l);
}
const chk = (key, name) => {
  const l = document.createElement("label"); l.className = "chk";
  l.innerHTML = `<input type="checkbox">${name}`;
  const r = l.querySelector("input"); r.checked = S[key]; ins[key] = r;
  r.onchange = () => { S[key] = r.checked; applyLight(); };
  ui.appendChild(l);
};
chk("shadows", "Sombras del sol"); chk("occ", "Oclusión (Hi-Z)"); chk("lights", "Luces");
const tl = document.createElement("label");
tl.innerHTML = 'Secuencia<input type="range" min="0" max="56" step="0.1"><output></output>';
const tr = tl.querySelector("input"), to2 = tl.querySelector("output");
ui.appendChild(tl);
chk("pause", "Pausar secuencia");
tr.oninput = () => { S.pause = true; ins.pause.checked = true; tSeq = +tr.value; };
const PRESETS = { "Amanecer": { el: 7, az: 95, exp: 1.1 }, "Mediodía": { el: 62, az: 200, exp: 1 },
  "Atardecer": { el: 4, az: 268, sun: 1.2, exp: 1.2 }, "Noche": { el: -12, az: 268, exp: 2.0, pl: 1.2 } };
const row = document.createElement("div"); row.className = "row";
for (const [name, v] of Object.entries(PRESETS)) {
  const b = document.createElement("button"); b.textContent = name;
  b.onclick = () => { Object.assign(S, { sun: 1, amb: 1, exp: 1, pl: 1 }, v); showVals(); applyLight(); };
  row.appendChild(b);
}
ui.insertBefore(row, ui.children[1]);
ui.querySelector("h4").onclick = () => ui.classList.toggle("min");
showVals();
applyLight();

// ---- Camara ----
const ext = 1000;
const cam = { x: ext / 2, y: cine ? 2 : 40, z: ext / 2, yaw: 0, pitch: -0.16, free: false };
const keys = {};
addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (e.code === "KeyF") { cam.free = !cam.free; if (!cam.free) document.exitPointerLock(); }
  if (e.code === "KeyH") hud.style.display = hud.style.display === "block" ? "none" : "block";
  if (e.code === "KeyR") tSeq = 0;
  if (e.code === "KeyL") ui.classList.toggle("min");
});
addEventListener("keyup", (e) => { keys[e.code] = false; });
c.addEventListener("click", () => { if (cam.free) c.requestPointerLock(); });
addEventListener("mousemove", (e) => {
  if (document.pointerLockElement !== c) return;
  cam.yaw += e.movementX * 0.002;
  cam.pitch = Math.max(-1.5, Math.min(1.5, cam.pitch - e.movementY * 0.002));
});

// Secuencia de ~50 s: estatua heroe -> se revela el ejercito -> vuelo por un pasillo -> vista aerea.
const K = [0, 6, 11, 15, 19, 23, 27, 32, 35, 38, 41, 46, 52];
const P = [[3, 1.7, -9], [-4, 2.4, -7], [-3.4, 3.0, -1.4], [0, 3.1, -3.8], [3.4, 2.8, -1.4], [2.5, 3.4, -28], [0, 2.6, -110],
  [0, 2.2, -300], [1.4, 1.9, -352], [2.3, 1.6, -364.5], [2.4, 1.8, -380], [0, 60, -400], [0, 130, -520]];
const T = [[0, 3.0, 0], [0, 2.8, 0], [0, 3.6, 0], [0, 3.4, 0], [0, 2.8, 0], [0, 2.8, -160], [0, 2.8, -350],
  [1.0, 2.6, -420], [4.1, 2.6, -368], [4.1, 2.3, -368.5], [4.1, 3.2, -390], [0, 0, -800], [0, 0, -1000]];
const SEQ = 56, TEND = K[K.length - 1];
const cr = (a, b, c, d, u) => a.map((_, i) => 0.5 * ((2 * b[i]) + (-a[i] + c[i]) * u + (2 * a[i] - 5 * b[i] + 4 * c[i] - d[i]) * u * u + (-a[i] + 3 * b[i] - 3 * c[i] + d[i]) * u ** 3));
const path = (A, t) => {
  let i = 0; while (i < K.length - 2 && t > K[i + 1]) i++;
  const u = Math.min(1, Math.max(0, (t - K[i]) / (K[i + 1] - K[i])));
  return cr(A[Math.max(i - 1, 0)], A[i], A[i + 1], A[Math.min(i + 2, A.length - 1)], u);
};

const nf = (x) => Math.round(x).toLocaleString("es-ES");
const fmt = (x) => x >= 1e9 ? (x / 1e9).toFixed(1) + " mil millones" : x >= 1e6 ? (x / 1e6).toFixed(1) + " millones" : nf(x);
const caption = (t, s) => {
  if (!cine) return "";
  if (t > 2 && t < 10) return `${nf(meta.tris0[0])} polígonos`;
  if (t > 24 && t < 33) return `${nf(N)} estatuas`;
  if (t > 41 && t < 55 && s[1] > 0) return `${fmt(s[2])} de triángulos<small>se dibujan ${fmt(s[1])}</small>`;
  return "";
};

let lastCap = null;
let last = performance.now(), t0 = last, ms = 16, cpu = 0, f = 0, s = [0, 0, 0, 0, 0, 0], path0 = 0;
const loop = (now) => {
  const dt = Math.min((now - last) / 1000, 0.1);
  if (!S.pause) tSeq += dt;
  const t = tSeq % SEQ;
  if (!S.pause) tr.value = t;
  to2.textContent = t.toFixed(0) + " s";
  if (cam.free) {
    const sp = (keys.ShiftLeft ? 120 : 25) * dt;
    const fx = Math.sin(cam.yaw), fz = -Math.cos(cam.yaw);
    const mv = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0), st = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
    cam.x += (fx * mv - fz * st) * sp; cam.z += (fz * mv + fx * st) * sp;
    cam.y = Math.max(0.8, cam.y + ((keys.Space ? 1 : 0) - (keys.ControlLeft ? 1 : 0)) * sp);
  } else if (cine) {
    const [x, y, z] = path(P, Math.min(t, TEND)), [tx, ty, tz] = path(T, Math.min(t, TEND));
    cam.x = x; cam.y = Math.max(y, 1.2); cam.z = z;
    cam.yaw = Math.atan2(tx - x, -(tz - z));
    cam.pitch = Math.atan2(ty - y, Math.hypot(tx - x, tz - z));
  } else {
    path0 += dt * 0.06;
    const r = ext * 0.3;
    cam.x = ext / 2 + r * Math.cos(path0); cam.z = ext / 2 + r * Math.sin(path0);
    cam.y = 32 + 10 * Math.sin(path0 * 3); cam.yaw = path0 + Math.PI; cam.pitch = -0.16;
  }
  const a = performance.now();
  p.frame(cam.x, cam.y, cam.z, cam.yaw, cam.pitch);
  guard();
  cpu = cpu * 0.95 + (performance.now() - a) * 0.05;
  ms = ms * 0.95 + (now - last) * 0.05; last = now;
  if (++f % 20 === 0) {
    s = Array.from(p.stats());
    window.__stats = { ms, cpu, s, t };
    if (hud.style.display === "block") hud.textContent =
`PHOENIX · ${meta.models} modelos × ${meta.lods} LOD · t=${t.toFixed(1)} s
instancias ${nf(N + EXTRA)} · visibles ${nf(s[0])} · draws con datos ${s[3]} de ${meta.models * meta.lods}
triangulos a resolucion completa ${fmt(s[2])}
triangulos dibujados ${fmt(s[1])}  (${(s[2] / Math.max(s[1], 1)).toFixed(0)}x menos)
frame ${ms.toFixed(2)} ms (${(1000 / ms).toFixed(0)} fps) · CPU submit ${cpu.toFixed(3)} ms
GPU: culling ${s[4].toFixed(2)} · render ${s[5].toFixed(2)} · sombras ${s[6].toFixed(2)} · hiz+post ${s[7].toFixed(2)} ms`;
  }
  const txt = cam.free ? "" : caption(t, s);
  if (txt !== lastCap) {
    lastCap = txt;
    if (txt) { cap.innerHTML = txt; cap.style.opacity = 1; } else cap.style.opacity = 0;
  }
  requestAnimationFrame(loop);
};
requestAnimationFrame(loop);
</script>
